AWSTemplateFormatVersion: '2010-09-09'
Description: 'Fargate SOCKS5 Proxy Infrastructure - orchestrator idle shutdown + abandoned-task reaper'

Parameters:
  EnvironmentName:
    Type: String
    Default: proxy
    Description: Environment name for resource naming
  
  ReaperTimeoutMinutes:
    Type: Number
    Default: 120
    Description: Max task age in minutes before the reaper force-stops it (abandoned-task cost guard; 0 disables)
  
  ClientPublicIP:
    Type: String
    Default: ""
    Description: Client public IP to allowlist (e.g., 203.0.113.42/32). Leave empty to disable IP allowlist
  
  IPAllowlistEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Enable IP allowlist mode (security group restricted to ClientPublicIP)
  
  ProxyUsername:
    Type: String
    Default: ""
    Description: SOCKS5 proxy username. Leave empty for no authentication. Requires ProxyPassword.
  
  ProxyPassword:
    Type: String
    Default: ""
    NoEcho: true
    Description: SOCKS5 proxy password. Requires ProxyUsername.

Conditions:
  IsIPAllowlistEnabled:
    Fn::Equals:
      - !Ref IPAllowlistEnabled
      - 'true'
  IsNotIPAllowlistEnabled:
    Fn::Not:
      - Condition: IsIPAllowlistEnabled
  HasClientIP:
    Fn::Not:
      - Fn::Equals:
          - !Ref ClientPublicIP
          - ''
  EnableIPAllowlist:
    Fn::And:
      - !Condition IsIPAllowlistEnabled
      - !Condition HasClientIP
  UseProxyAuth:
    Fn::Not:
      - Fn::Equals:
          - !Ref ProxyUsername
          - ''

Resources:
  ProxyVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-vpc'

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref ProxyVPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-subnet-1'

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref ProxyVPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-subnet-2'

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-igw'

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref ProxyVPC
      InternetGatewayId: !Ref InternetGateway

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref ProxyVPC
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-rt'

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteTableAssociation1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  SubnetRouteTableAssociation2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  # Security Groups
  ProxySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for SOCKS5 proxy with IP allowlist support
      VpcId: !Ref ProxyVPC
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-sg'

  # Ingress rule for IP allowlist mode
  ProxySecurityGroupIngressAllowlist:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: EnableIPAllowlist
    Properties:
      GroupId: !Ref ProxySecurityGroup
      IpProtocol: tcp
      FromPort: 1080
      ToPort: 1080
      CidrIp: !Ref ClientPublicIP
      Description: !Sub 'SOCKS5 proxy access from allowlisted IP ${ClientPublicIP}'

  # Ingress rule for open access mode (when IP allowlist not enabled)
  ProxySecurityGroupIngressOpen:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: IsNotIPAllowlistEnabled
    Properties:
      GroupId: !Ref ProxySecurityGroup
      IpProtocol: tcp
      FromPort: 1080
      ToPort: 1080
      CidrIp: 0.0.0.0/0
      Description: SOCKS5 proxy port (IP allowlist not enabled)

  # ECS Cluster
  ProxyCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: proxy-cluster
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-cluster'

  # Task Execution Role
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-task-execution-role'

  # Task Role (for any AWS API calls from the task)
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SecurityGroupManagement
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:RevokeSecurityGroupIngress
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeSecurityGroupRules
                Resource: '*'
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-task-role'

  # Task Definition for SOCKS5 Proxy
  SOCKS5TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: go-socks5-proxy
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: '256'  # 0.25 vCPU (minimum for Fargate)
      Memory: '512'  # 512 MB
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      
      ContainerDefinitions:
        - Name: socks5-proxy
          Image: serjs/go-socks5-proxy:latest
          PortMappings:
            - ContainerPort: 1080
              Protocol: tcp
          Environment:
            # Authentication — enabled when ProxyUsername is provided
            - Name: REQUIRE_AUTH
              Value: !If [UseProxyAuth, 'true', 'false']
            - Name: PROXY_USER
              Value: !Ref ProxyUsername
            - Name: PROXY_PASSWORD
              Value: !Ref ProxyPassword
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref TaskLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
          
          # Bind mount or volume for persistent config
          MountPoints: []
          
          # Lifecycle: idle-stopped by the local orchestrator; force-stopped by
          # the reaper Lambda if this machine dies (see ReaperFunction below).

      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-task-definition'

  # CloudWatch Log Group for ECS tasks
  TaskLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${EnvironmentName}-go-socks5-proxy'
      RetentionInDays: 7

  # ────────────────────────────────────────────────────────────────
  # Reaper: last-resort cost guard for abandoned Fargate tasks.
  #
  # The local orchestrator performs the real, activity-based idle
  # shutdown. This Lambda exists only for the failure case where this
  # machine dies while a task is running: no traffic can flow without
  # the local proxy, so a task older than ReaperTimeoutMinutes is
  # certainly abandoned and is stopped on task age alone.
  # (The upstream socks5 image does not log per-connection activity,
  # so CloudWatch log scanning is NOT a usable activity signal.)
  # ────────────────────────────────────────────────────────────────
  ReaperRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ECSAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ecs:DescribeTasks
                  - ecs:ListTasks
                  - ecs:StopTask
                Resource: '*'

  ReaperFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${EnvironmentName}-socks5-reaper'
      Runtime: python3.11
      Handler: index.lambda_handler
      Role: !GetAtt ReaperRole.Arn
      Timeout: 60
      Environment:
        Variables:
          CLUSTER_NAME: !Ref ProxyCluster
          REAPER_TIMEOUT_MINUTES: !Ref ReaperTimeoutMinutes
      Code:
        ZipFile: |
          """Reaper: stop Fargate tasks that have outlived their welcome.

          This is a COST GUARD, not the activity-based idle shutdown —
          the local orchestrator does that. It exists for the failure
          case where the local machine dies while a task keeps running.
          All traffic flows through the local proxy, so a task older
          than REAPER_TIMEOUT_MINUTES is certainly abandoned and safe
          to stop on task age alone.
          """
          import boto3
          import os
          from datetime import datetime, timezone

          ecs = boto3.client('ecs')

          CLUSTER_NAME = os.environ['CLUSTER_NAME']
          REAPER_TIMEOUT_MINUTES = int(os.environ['REAPER_TIMEOUT_MINUTES'])

          def lambda_handler(event, context):
              # 0 (or negative) disables the reaper — set via setup.sh.
              if REAPER_TIMEOUT_MINUTES <= 0:
                  print('Reaper disabled (REAPER_TIMEOUT_MINUTES <= 0)')
                  return {'statusCode': 200, 'body': 'Reaper disabled'}

              running = ecs.list_tasks(cluster=CLUSTER_NAME, desiredStatus='RUNNING')
              task_arns = running.get('taskArns', [])
              if not task_arns:
                  return {'statusCode': 200, 'body': 'No running tasks'}

              # One batched describe instead of one call per task.
              tasks = ecs.describe_tasks(
                  cluster=CLUSTER_NAME,
                  tasks=task_arns
              ).get('tasks', [])

              now = datetime.now(timezone.utc)
              stopped = []

              for task in tasks:
                  created = task.get('createdAt')
                  if created is None:
                      continue
                  age_minutes = (now - created).total_seconds() / 60

                  if age_minutes > REAPER_TIMEOUT_MINUTES:
                      ecs.stop_task(
                          cluster=CLUSTER_NAME,
                          task=task['taskArn'],
                          reason=f'Reaper: abandoned task (older than {REAPER_TIMEOUT_MINUTES} minutes)'
                      )
                      stopped.append(task['taskArn'])
                      print(f"Stopped abandoned task {task['taskArn'].split('/')[-1]} "
                            f"(age: {age_minutes:.0f} minutes)")

              body = (f'Stopped {len(stopped)} abandoned task(s)'
                      if stopped else 'No abandoned tasks')
              return {'statusCode': 200, 'body': body}

  # EventBridge Rule to run the reaper every 15 minutes
  ReaperSchedule:
    Type: AWS::Events::Rule
    Properties:
      Description: Trigger the abandoned-task reaper check every 15 minutes
      ScheduleExpression: rate(15 minutes)
      State: ENABLED
      Targets:
        - Arn: !GetAtt ReaperFunction.Arn
          Id: ReaperTarget

  ReaperLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ReaperFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ReaperSchedule.Arn

Outputs:
  ClusterName:
    Description: ECS Cluster Name
    Value: !Ref ProxyCluster
    Export:
      Name: !Sub '${EnvironmentName}-cluster-name'

  TaskDefinition:
    Description: Task Definition ARN
    Value: !Ref SOCKS5TaskDefinition
    Export:
      Name: !Sub '${EnvironmentName}-task-definition'

  SecurityGroupId:
    Description: Security Group ID for IP allowlist updates
    Value: !Ref ProxySecurityGroup
    Export:
      Name: !Sub '${EnvironmentName}-security-group-id'

  IPAllowlistEnabled:
    Description: Whether IP allowlist is enabled
    Value: !If [EnableIPAllowlist, 'true', 'false']
    Export:
      Name: !Sub '${EnvironmentName}-ip-allowlist-enabled'

  AllowlistedIP:
    Description: Currently allowlisted client IP
    Condition: EnableIPAllowlist
    Value: !Ref ClientPublicIP
    Export:
      Name: !Sub '${EnvironmentName}-allowlisted-ip'

  VPCId:
    Description: VPC ID
    Value: !Ref ProxyVPC
    Export:
      Name: !Sub '${EnvironmentName}-vpc-id'

  SubnetId1:
    Description: Public Subnet 1
    Value: !Ref PublicSubnet1
    Export:
      Name: !Sub '${EnvironmentName}-subnet-1'

  SubnetId2:
    Description: Public Subnet 2
    Value: !Ref PublicSubnet2
    Export:
      Name: !Sub '${EnvironmentName}-subnet-2'

  LogGroupName:
    Description: CloudWatch Log Group
    Value: !Ref TaskLogGroup
    Export:
      Name: !Sub '${EnvironmentName}-log-group'
