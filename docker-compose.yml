services:
  # The async HTTP proxy that dynamically updates SOCKS5 upstream
  http-proxy:
    build: ./async-proxy
    container_name: http-proxy
    restart: unless-stopped
    # Host-side bind: localhost-only by default for safety. The container still
    # listens on 0.0.0.0:8080 internally; only the host publish port is bound.
    # To expose on the LAN (other devices), set PROXY_BIND_ADDRESS=0.0.0.0 in
    # .env — WARNING: this makes it an open proxy reachable by port scanners /
    # anyone who can reach the host, and any request wakes the remote task.
    ports:
      - "${PROXY_BIND_ADDRESS:-127.0.0.1}:${LOCAL_PROXY_PORT:-8080}:${LOCAL_PROXY_PORT:-8080}"  # HTTP proxy port
    environment:
      - LISTEN_HOST=0.0.0.0
      - LISTEN_PORT=${LOCAL_PROXY_PORT:-8080}
      - HEALTH_PORT=${HEALTH_PORT:-8081}
      - ORCHESTRATOR_URL=http://proxy-orchestrator:${ORCHESTRATOR_PORT:-5000}
      - CHECK_INTERVAL=${CHECK_INTERVAL:-30}
      - WAKING_TIMEOUT_MS=${WAKING_TIMEOUT_MS:-120000}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # Proxy authentication (from .env)
      - REQUIRE_AUTH=${REQUIRE_AUTH:-false}
      - PROXY_USER=${PROXY_USER:-}
      - PROXY_PASSWORD=${PROXY_PASSWORD:-}
      # Local proxy authentication (for LAN/multi-device use)
      - LOCAL_REQUIRE_AUTH=${LOCAL_REQUIRE_AUTH:-false}
      - LOCAL_PROXY_USER=${LOCAL_PROXY_USER:-}
      - LOCAL_PROXY_PASSWORD=${LOCAL_PROXY_PASSWORD:-}
    depends_on:
      - proxy-orchestrator
    networks:
      - proxy-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:${HEALTH_PORT:-8081}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Bound log growth on a long-running host
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Fargate orchestrator - uses restricted IAM user 'proxy-orchestrator'
  # Credentials are provided via .env (generated by setup.sh)
  proxy-orchestrator:
    build:
      context: ./proxy-orchestrator
      dockerfile: Dockerfile
    container_name: proxy-orchestrator
    restart: unless-stopped
    # Management API (5000) is intentionally NOT published on the host. It is
    # only reachable via the compose network (http-proxy) and from inside the
    # container (Docker healthcheck, proxy-manage.sh / test-ip-allowlist.sh via
    # `docker exec`). The API is unauthenticated (/start, /wake, /stop, /status)
    # so it must not be exposed. To publish it anyway (not recommended):
    # ports:
    #   - "${ORCHESTRATOR_BIND_ADDRESS:-127.0.0.1}:${ORCHESTRATOR_PORT:-5000}:${ORCHESTRATOR_PORT:-5000}"
    environment:
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - ECS_CLUSTER=${ECS_CLUSTER:-proxy-cluster}
      - ECS_TASK_DEFINITION=${ECS_TASK_DEFINITION:-go-socks5-proxy}
      - TASK_SUBNET=${TASK_SUBNET}
      - TASK_SECURITY_GROUP=${TASK_SECURITY_GROUP}
      - SOCKS5_PORT=${SOCKS5_PORT:-1080}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # IP Allowlist configuration
      - IP_ALLOWLIST_ENABLED=${IP_ALLOWLIST_ENABLED:-false}
      - CLIENT_SECURITY_GROUP_ID=${CLIENT_SECURITY_GROUP_ID}
      - DUAL_IP_RETENTION_MINUTES=${DUAL_IP_RETENTION_MINUTES:-180}
      # Idle timeout — remote proxy shuts down after this many minutes of inactivity
      - TASK_IDLE_TIMEOUT_MINUTES=${TASK_IDLE_TIMEOUT_MINUTES:-60}
      - HTTP_PROXY_HEALTH_URL=${HTTP_PROXY_HEALTH_URL:-http://http-proxy:8081/health}
      # Auto-start remote Fargate task. Set false via `./proxy-manage.sh start --no-remote`
      # (or by adding AUTO_START_REMOTE=false to .env) to run the local proxy
      # without starting the remote SOCKS5 proxy automatically.
      - AUTO_START_REMOTE=${AUTO_START_REMOTE:-false}
    env_file:
      - .env
    networks:
      - proxy-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${ORCHESTRATOR_PORT:-5000}/status"]
      interval: 30s
      timeout: 3s
      retries: 3
    # Bound log growth on a long-running host
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy-network:
    driver: bridge